name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: true
        default: 'v0.0.0'

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest] # , ubuntu-latest
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        env:
          VIBEMON_WEB_READ_TOKEN: ${{ secrets.VIBEMON_WEB_READ_TOKEN }}
        if: matrix.os == 'macos-latest'
        run: |
          pnpm lint
          pnpm exec jest --coverage --runInBand
          pnpm check:registry

      - name: Sync version from tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          node -e "if (!/^v?[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_TAG)) throw new Error('Invalid release version')"
          npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version

      - name: Import macOS codesign certificate
        if: matrix.os == 'macos-latest'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Prepare for app notarization
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          API_KEY_SECRET: ${{ secrets.API_KEY_SECRET }}
          API_KEY_ID: ${{ secrets.API_KEY_ID }}
          API_KEY_ISSUER_ID: ${{ secrets.API_KEY_ISSUER_ID }}
        run: |
          umask 077
          KEY_PATH="$RUNNER_TEMP/notarization-key.p8"
          printf '%s' "$API_KEY_SECRET" > "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$API_KEY_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Build Electron app on macOS
        if: matrix.os == 'macos-latest'
        run: pnpm exec electron-builder --mac --publish never

      - name: Build Electron app on Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: pnpm exec electron-builder --win --publish never --config.forceCodeSigning=true
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTS_PASSWORD }}

      - name: Verify trusted Windows signatures
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem dist -Filter *.exe)
          if ($installers.Count -eq 0) { throw 'No Windows installer produced' }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Trusted Authenticode signature required for $($installer.Name): $($signature.Status)"
            }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-artifacts
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.yml
          if-no-files-found: ignore

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Get tag message
        id: tag_message
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          TAG_REF=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$RELEASE_TAG")

          OBJECT_TYPE=$(echo "$TAG_REF" | jq -r '.object.type')
          OBJECT_SHA=$(echo "$TAG_REF" | jq -r '.object.sha')

          TAG_MESSAGE=""
          if [ "$OBJECT_TYPE" = "tag" ]; then
            TAG_MESSAGE=$(curl -s \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/git/tags/$OBJECT_SHA" | \
              jq -r '.message')
          fi

          if [ -z "$TAG_MESSAGE" ] || [ "$TAG_MESSAGE" = "null" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 "$RELEASE_TAG^" 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              TAG_MESSAGE=$(printf '## Changes since %s\n\n%s\n' \
                "$PREV_TAG" \
                "$(git log --pretty='- %s' "$PREV_TAG..$RELEASE_TAG" --no-merges)")
            else
              TAG_MESSAGE="Release $RELEASE_TAG"
            fi
          fi

          echo "$TAG_MESSAGE" > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Release ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          body_path: release_notes.md
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/latest*.yml

      - name: Calculate DMG SHA256
        id: sha256
        run: |
          DMG_FILE=$(find ./artifacts -name "*.dmg" | head -n 1)
          if [ -z "$DMG_FILE" ]; then
            echo "No dmg artifact found, skipping Homebrew trigger"
            echo "sha256=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sha256=$(shasum -a 256 "$DMG_FILE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Trigger Homebrew tap update
        if: steps.sha256.outputs.sha256 != ''
        env:
          GH_TOKEN: ${{ secrets.GHP_TOKEN }}
        run: |
          curl -sL -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -d "{\"event_type\":\"gitops\",\"client_payload\":{\"project\":\"vibemon\",\"version\":\"${{ steps.release_tag.outputs.tag }}\",\"sha256\":\"${{ steps.sha256.outputs.sha256 }}\"}}" \
            https://api.github.com/repos/opspresso/homebrew-tap/dispatches
