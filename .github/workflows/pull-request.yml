name: Pull request checks
# Fast checks for every pull request. The full release verification stays in
# build-release.yml (registry-drift.yml and overlay-verification.yml).
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec jest --coverage --runInBand
      - run: pnpm test:design
      - run: pnpm check:registry
      - run: pnpm check:distribution
  hooks:
    # Hooks run on every desktop OS; path and home handling differ on Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - run: python -m pip install pytest ./collector
      - run: python -m pytest tests/hooks collector/tests -q
      - run: node --experimental-vm-modules --test tests/hooks/opencode.test.mjs tests/hooks/openclaw.test.mjs
      - name: Verify the widget worker restart against real processes
        if: runner.os == 'macOS'
        run: node tests/native/widget-runtime-smoke.cjs
