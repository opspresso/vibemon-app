name: Overlay Verification

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'jest.config.js'
      - 'eslint.config.js'
      - '.nvmrc'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/overlay-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-overlays:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v6
        with:
          version: '12.10.1'
      - run: pnpm install --frozen-lockfile
      - name: Lint and unit regressions
        run: pnpm lint && pnpm test:design && pnpm exec jest --coverage --runInBand
      - name: Verify desktop workspace
        timeout-minutes: 2
        run: pnpm test:workspace
      - name: Verify native display scaling
        run: pnpm test:overlays
      - name: Verify WebGL alpha hit testing
        run: pnpm test:hit-testing
      - name: Verify fractional display scaling on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($scale in @('1.25', '1.5', '2')) {
            pnpm test:overlays --force-device-scale-factor=$scale
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify unpacked desktop package
        run: pnpm exec electron-builder --dir --publish never --config.directories.output=out/package-check
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Save geometry results and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: overlays-${{ matrix.os }}
          path: |
            out/overlay-tests/
            out/workspace-tests/
            out/hit-test/
