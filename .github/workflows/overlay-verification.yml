name: Overlay Verification

# Runs before every release (called by build-release.yml with the release commit) and on demand.
# Pull requests and pushes do not start it.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to verify; defaults to the triggering commit.
        type: string
        required: false
  workflow_dispatch:
permissions:
  contents: read

jobs:
  native-overlays:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v6
        with:
          version: '12.10.1'
      - run: pnpm install --frozen-lockfile
      - name: Lint and unit regressions
        run: pnpm lint && pnpm test:design && pnpm exec jest --coverage --runInBand
      - name: Verify desktop workspace
        timeout-minutes: 2
        run: pnpm test:workspace
      - name: Verify native display scaling
        run: pnpm test:overlays
      - name: Verify WebGL alpha hit testing
        run: pnpm test:hit-testing
      - name: Verify fractional display scaling on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($scale in @('1.25', '1.5', '2')) {
            pnpm test:overlays --force-device-scale-factor=$scale
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify unpacked desktop package
        run: pnpm exec electron-builder --dir --publish never --config.directories.output=out/package-check
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged macOS widgets
        if: runner.os == 'macOS'
        run: |
          app=$(ls -d out/package-check/mac*/VibeMon.app)
          test -f "$app/Contents/PlugIns/VibeMonWidgets.appex/Contents/Resources/Metadata.appintents/extract.actionsdata"
          test -f "$app/Contents/Resources/widget-center.node"
          plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw "$app/Contents/Info.plist" | grep -qx vibemon
          pnpm preview:widgets
          node scripts/verify-macos-widgets.mjs "$app"
          node tests/native/widget-runtime-smoke.cjs
      - name: Save geometry results and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: overlays-${{ matrix.os }}
          path: |
            out/overlay-tests/
            out/workspace-tests/
            out/hit-test/
            out/widgets/
