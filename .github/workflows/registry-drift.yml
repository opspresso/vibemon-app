name: Public distribution
# Runs before every release (called by build-release.yml with the release commit) and on demand.
# Pull requests and pushes do not start it.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to verify; defaults to the triggering commit.
        type: string
        required: false
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - run: node --test tests/design.test.mjs
      - run: node scripts/check-registry.mjs
      - run: node scripts/export-web.mjs --write
      - uses: actions/upload-artifact@v7
        with:
          name: public-web-distribution
          path: dist/web
  hooks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - run: python -m pip install pytest ./collector
      - run: python -m pytest tests/hooks collector/tests -q
      - run: node --experimental-vm-modules --test tests/hooks/opencode.test.mjs tests/hooks/openclaw.test.mjs
      - name: Verify PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/hooks/install.test.ps1
  installer-python39:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/hooks/test_install*.py
  prometheus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install ./collector
      - run: python collector/tests/promql_fixture.py > /tmp/vibemon-promql.json
      - run: docker run --rm --entrypoint /bin/promtool -v /tmp/vibemon-promql.json:/fixture.json:ro prom/prometheus:v3.7.3 test rules /fixture.json
