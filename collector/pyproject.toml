[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibemon-collector"
version = "0.2.0"
description = "Bounded host and Kubernetes summary collector for VibeMon"
requires-python = ">=3.10"
dependencies = ["psutil>=5.9,<8"]

[project.scripts]
vibemon-collector = "vibemon_collector.__main__:main"

[tool.setuptools.packages.find]
include = ["vibemon_collector*"]
